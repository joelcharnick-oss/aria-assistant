<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌅 Breakfast Picker!</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Breakfast">
  <meta name="theme-color" content="#E8B44A">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --p-bg:#0E1A18; --p-surf:#172320; --p-edge:#1E302C;
      --p-text:#EFE8D8; --p-text2:#8EA8A0; --p-text3:#4E6860;
      --p-amber:#E8B44A; --p-amber-dim:rgba(232,180,74,.15);
      --p-green:#4EAA80; --p-red:#E86060;
      --k-top:#FDF3E3; --k-bot:#FFE0B0;
      --k-text:#2A1A08; --k-text2:#8C6A44;
      --k-surf:rgba(255,255,255,0.88); --k-border:rgba(0,0,0,0.08);
      --rXL:24px; --rLG:16px; --rMD:12px; --rPill:50px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html{height:100%;}
    body{font-family:'DM Sans',system-ui,sans-serif;min-height:100dvh;overflow-x:hidden;}
    .hidden{display:none!important;}
    input{font-family:'DM Sans',system-ui,sans-serif;}

    /* ═══ SETUP ══════════════════════════════════════════════════════════ */
    #v-setup{background:var(--p-bg);min-height:100dvh;display:flex;flex-direction:column;padding-bottom:36px;}
    .s-top{padding:48px 24px 0;}
    .s-eyebrow{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--p-amber);margin-bottom:8px;}
    .s-h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.9em,6vw,2.6em);font-weight:700;line-height:1.08;color:var(--p-text);text-wrap:balance;}
    .s-h1 em{font-style:italic;font-weight:300;color:var(--p-text2);}
    .s-sec{padding:26px 24px 0;}
    .s-sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .s-sec-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--p-text3);}
    .s-sec-action{font-size:13px;font-weight:500;color:var(--p-amber);background:none;border:none;cursor:pointer;padding:0;}

    /* Kids */
    .kids-list{display:flex;flex-direction:column;gap:6px;}
    .kid-row{display:flex;align-items:center;gap:10px;}
    .kid-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
    .kid-input{flex:1;font-size:15px;font-weight:500;background:var(--p-surf);border:1px solid var(--p-edge);border-radius:10px;color:var(--p-text);padding:10px 14px;}
    .kid-input:focus{outline:none;border-color:var(--p-amber);}
    .icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--p-text3);font-size:18px;cursor:pointer;border-radius:8px;flex-shrink:0;line-height:1;}
    .icon-btn:active{color:var(--p-red);}
    .dashed-btn{display:flex;align-items:center;gap:6px;padding:10px 14px;background:transparent;border:1.5px dashed var(--p-edge);border-radius:10px;color:var(--p-text3);font-size:14px;cursor:pointer;margin-top:4px;font-family:inherit;}
    .dashed-btn:active{color:var(--p-amber);border-color:var(--p-amber);}

    /* Choices */
    .choices-list{display:flex;flex-direction:column;gap:3px;}
    .c-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--p-surf);border:1px solid var(--p-edge);border-radius:10px;}
    .c-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
    .c-name{font-size:14px;font-weight:600;color:var(--p-text);flex:1;}
    .c-val{font-size:14px;color:var(--p-text2);}
    .c-time{font-size:11px;color:var(--p-text3);white-space:nowrap;}
    .no-choices{font-size:14px;color:var(--p-text3);padding:10px 0;}

    /* History */
    .h-scroll{max-height:260px;overflow-y:auto;}
    .h-group{margin-bottom:6px;}
    .h-date{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--p-text3);padding:8px 0 4px;}
    .h-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p-surf);border:1px solid var(--p-edge);border-radius:8px;margin-bottom:2px;}
    .h-val{font-size:13px;color:var(--p-text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .h-name{font-size:13px;font-weight:600;color:var(--p-text);min-width:48px;}
    .h-time{font-size:11px;color:var(--p-text3);white-space:nowrap;flex-shrink:0;}

    /* Toggle list */
    .t-list{display:flex;flex-direction:column;gap:2px;}
    .t-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--p-surf);border:1px solid var(--p-edge);border-radius:8px;cursor:pointer;user-select:none;position:relative;transition:background .1s;}
    .t-row:first-child{border-radius:var(--rMD) var(--rMD) 8px 8px;}
    .t-row:last-child{border-radius:8px 8px var(--rMD) var(--rMD);}
    .t-row:only-child{border-radius:var(--rMD);}
    .t-row:active{background:var(--p-edge);}
    .t-row::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--p-amber);border-radius:0 2px 2px 0;opacity:0;transition:opacity .2s;}
    .t-row.on::before{opacity:1;}
    .t-action-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--p-text3);font-size:15px;cursor:pointer;border-radius:6px;flex-shrink:0;line-height:1;}
    .t-action-btn:active{color:var(--p-amber);}
    .t-action-btn.del:active{color:var(--p-red);}
    .t-emoji{font-size:22px;width:30px;text-align:center;flex-shrink:0;line-height:1;transition:filter .2s;}
    .t-row.off .t-emoji{filter:grayscale(1) opacity(.3);}
    .t-name{flex:1;font-size:15px;font-weight:500;color:var(--p-text);transition:color .2s;}
    .t-row.off .t-name{color:var(--p-text3);}
    .t-sw{width:44px;height:26px;border-radius:13px;background:var(--p-edge);border:1.5px solid rgba(255,255,255,.05);flex-shrink:0;position:relative;transition:background .22s;}
    .t-sw::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2.5px;left:2.5px;transition:transform .22s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 4px rgba(0,0,0,.35);}
    .t-row.on .t-sw{background:var(--p-green);border-color:var(--p-green);}
    .t-row.on .t-sw::after{transform:translateX(18px);}

    /* Add / edit item form */
    .item-form{background:var(--p-surf);border:1px solid var(--p-edge);border-radius:var(--rMD);padding:14px;display:flex;flex-direction:column;gap:10px;}
    .item-form.inline{margin-bottom:2px;}
    .form-top-row{display:flex;align-items:center;gap:10px;}
    .sel-emoji{width:52px;height:52px;font-size:28px;display:flex;align-items:center;justify-content:center;background:var(--p-edge);border-radius:12px;flex-shrink:0;line-height:1;cursor:default;border:2px solid transparent;transition:border-color .15s;}
    .form-name-inp{flex:1;font-size:15px;background:var(--p-edge);border:1px solid rgba(255,255,255,.06);border-radius:10px;color:var(--p-text);padding:10px 12px;}
    .form-name-inp::placeholder{color:var(--p-text3);}
    .form-name-inp:focus{outline:none;border-color:var(--p-amber);}
    .emoji-hint{font-size:12px;color:var(--p-text3);padding:0 2px;}
    .emoji-hint span{color:var(--p-amber);}
    .emoji-grid{display:flex;flex-wrap:wrap;gap:5px;max-height:116px;overflow-y:auto;}
    .eopt{width:40px;height:40px;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--p-edge);border:2px solid transparent;cursor:pointer;padding:0;transition:border-color .12s,background .12s;line-height:1;}
    .eopt.sel{background:var(--p-amber-dim);border-color:var(--p-amber);}
    .eopt:active{background:var(--p-bg);}
    .form-actions{display:flex;gap:8px;}
    .btn-confirm{flex:1;padding:11px;font-family:inherit;font-size:14px;font-weight:600;color:var(--p-bg);background:var(--p-amber);border:none;border-radius:10px;cursor:pointer;transition:opacity .15s;}
    .btn-confirm:active{opacity:.85;}
    .btn-cancel-sm{padding:11px 16px;font-family:inherit;font-size:14px;font-weight:500;color:var(--p-text3);background:var(--p-edge);border:none;border-radius:10px;cursor:pointer;}

    /* Footer */
    .s-footer{padding:24px 24px 0;display:flex;flex-direction:column;gap:10px;}
    .count-line{text-align:center;font-size:13px;color:var(--p-text3);}
    .count-line strong{color:var(--p-amber);font-weight:600;}
    .btn-go{padding:17px 28px;font-family:inherit;font-size:16px;font-weight:600;color:var(--p-bg);background:var(--p-amber);border:none;border-radius:var(--rPill);cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .15s;}
    .btn-go:active{transform:scale(.97);opacity:.88;}
    .btn-outline{padding:13px 28px;font-family:inherit;font-size:14px;font-weight:500;color:var(--p-text3);background:transparent;border:1.5px solid var(--p-edge);border-radius:var(--rPill);cursor:pointer;}
    .btn-outline:active{border-color:var(--p-red);color:var(--p-red);}

    /* ═══ WHO ════════════════════════════════════════════════════════════ */
    #v-who{min-height:100dvh;background:linear-gradient(170deg,var(--k-top) 0%,var(--k-bot) 100%);display:flex;flex-direction:column;align-items:center;padding:52px 20px 48px;position:relative;}
    .w-h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(2em,8vw,3em);font-weight:700;color:var(--k-text);text-align:center;text-wrap:balance;margin-bottom:8px;}
    .w-sub{font-size:16px;color:var(--k-text2);text-align:center;margin-bottom:36px;}
    .kid-cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;max-width:560px;}
    .kcard{flex:1 1 190px;max-width:230px;min-height:190px;border-radius:var(--rXL);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;user-select:none;border:2.5px solid rgba(255,255,255,.5);box-shadow:0 8px 24px rgba(0,0,0,.1),0 2px 6px rgba(0,0,0,.06);transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;padding:20px 14px;position:relative;overflow:hidden;}
    .kcard::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.1);pointer-events:none;}
    .kcard:active{transform:scale(.92) rotate(-1deg);box-shadow:0 2px 8px rgba(0,0,0,.1);}
    .kcard.done{opacity:.65;cursor:default;}
    .kcard.done:active{transform:none;box-shadow:0 8px 24px rgba(0,0,0,.1);}
    .k-initial{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:1.9em;font-weight:700;font-family:'Fraunces',Georgia,serif;color:rgba(0,0,0,.65);border:2px solid rgba(255,255,255,.4);}
    .k-kname{font-size:1.2em;font-weight:700;font-family:'Fraunces',Georgia,serif;color:rgba(0,0,0,.7);}
    .k-choice{text-align:center;color:rgba(0,0,0,.55);font-size:.9em;line-height:1.4;}
    .k-choice-emoji{font-size:1.8em;margin-bottom:2px;}
    .all-done{margin-top:28px;text-align:center;font-size:15px;color:var(--k-text2);line-height:1.7;max-width:280px;}
    .gear-btn{position:absolute;top:18px;right:18px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--k-surf);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--k-border);border-radius:12px;font-size:18px;cursor:pointer;}
    .gear-btn:active{background:rgba(255,255,255,.6);}

    /* ═══ PICK ═══════════════════════════════════════════════════════════ */
    #v-pick{min-height:100dvh;background:linear-gradient(170deg,var(--k-top) 0%,var(--k-bot) 100%);display:flex;flex-direction:column;padding:32px 18px 0;position:relative;}
    .pick-hd{text-align:center;margin-bottom:22px;position:relative;}
    .pick-h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.8em,7vw,2.5em);font-weight:700;color:var(--k-text);line-height:1.1;text-wrap:balance;}
    .pick-sub{margin-top:6px;font-size:15px;color:var(--k-text2);}
    .back-btn{position:absolute;left:0;top:50%;transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--k-surf);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--k-border);border-radius:12px;font-size:18px;cursor:pointer;}
    .card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;flex:1;max-width:680px;margin:0 auto;width:100%;}
    @media(min-width:600px){.card-grid{grid-template-columns:repeat(3,1fr);}}
    @media(min-width:800px){.card-grid{grid-template-columns:repeat(4,1fr);}}
    .bcard{border-radius:var(--rXL);padding:26px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;user-select:none;border:2px solid rgba(255,255,255,.4);box-shadow:0 8px 24px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.07);transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;position:relative;overflow:hidden;}
    .bcard::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.1);pointer-events:none;}
    .bcard:active{transform:scale(.91) rotate(-1.2deg);box-shadow:0 2px 8px rgba(0,0,0,.12);}
    .bcard.sel{border-color:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(80,160,80,.5),0 8px 24px rgba(0,0,0,.14);}
    .bcard.sel::before{content:'✓';position:absolute;top:8px;right:8px;z-index:2;width:24px;height:24px;background:rgba(255,255,255,.9);border-radius:50%;font-size:13px;font-weight:700;color:#1E5A30;line-height:24px;text-align:center;}
    .bcard-emoji{font-size:clamp(2.8em,11vw,3.8em);line-height:1;filter:drop-shadow(1px 3px 6px rgba(0,0,0,.14));}
    .bcard-name{font-size:clamp(.85em,3vw,1em);font-weight:600;color:rgba(0,0,0,.68);text-align:center;line-height:1.2;}
    .empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 28px;color:var(--k-text2);text-align:center;}
    .empty-icon{font-size:3em;}
    .empty-state p{font-size:16px;line-height:1.6;}
    .pick-done-bar{padding:16px 18px 36px;display:flex;justify-content:center;background:linear-gradient(to top,var(--k-bot) 60%,transparent);}
    .pick-done-btn{padding:16px 36px;font-family:inherit;font-size:16px;font-weight:600;color:#fff;background:#3A8C50;border:none;border-radius:var(--rPill);cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.22);transition:transform .15s cubic-bezier(.34,1.56,.64,1),opacity .15s;}
    .pick-done-btn:active{transform:scale(.96);opacity:.88;}
    .pick-done-btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none;}

    /* ═══ OVERLAY ════════════════════════════════════════════════════════ */
    #overlay{display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;padding:24px;}
    #overlay.show{display:flex;}
    #ov-bg{position:absolute;inset:0;opacity:.93;}
    #ov-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
    #ov-card{position:relative;z-index:10;background:rgba(255,252,248,.97);border-radius:32px;padding:44px 32px 36px;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.12);max-width:340px;width:100%;animation:pop-in .45s cubic-bezier(.34,1.56,.64,1) forwards;}
    @keyframes pop-in{from{transform:scale(.4) rotate(-6deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
    #ov-emoji{font-size:5.5em;display:block;margin-bottom:14px;animation:e-spin .7s cubic-bezier(.34,1.56,.64,1) .25s both;}
    @keyframes e-spin{from{transform:scale(0) rotate(-200deg);}to{transform:scale(1) rotate(0);}}
    .ov-kid{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#9E8870;margin-bottom:2px;}
    .ov-chose{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#C0A888;margin-bottom:4px;}
    #ov-name{font-family:'Fraunces',Georgia,serif;font-size:2.1em;font-weight:700;color:#1E140A;margin-bottom:10px;line-height:1.1;}
    #ov-msg{font-size:15px;color:#6E5840;line-height:1.6;margin-bottom:28px;}
    #ov-btn{padding:16px 40px;font-family:inherit;font-size:16px;font-weight:600;color:#fff;border:none;border-radius:var(--rPill);cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 20px rgba(0,0,0,.2);}
    #ov-btn:active{transform:scale(.95);}

    /* Toast */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(14,26,24,.95);color:var(--p-text);font-size:14px;font-weight:500;padding:11px 22px;border-radius:var(--rPill);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:500;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
  </style>
</head>
<body>

<!-- ── SETUP ──────────────────────────────────────────────────────────────── -->
<div id="v-setup">
  <div class="s-top">
    <div class="s-eyebrow">Morning Setup</div>
    <h1 class="s-h1">What's for <em>breakfast?</em></h1>
  </div>

  <div class="s-sec">
    <div class="s-sec-head"><span class="s-sec-label">Kids</span></div>
    <div class="kids-list" id="kids-list"></div>
  </div>

  <div class="s-sec">
    <div class="s-sec-head"><span class="s-sec-label">Today's choices</span></div>
    <div id="choices-display"></div>
  </div>

  <div class="s-sec">
    <div class="s-sec-head">
      <span class="s-sec-label">Breakfast history</span>
      <button class="s-sec-action" onclick="clearHistory()">Clear all</button>
    </div>
    <div class="h-scroll" id="history-list"></div>
  </div>

  <div class="s-sec">
    <div class="s-sec-head">
      <span class="s-sec-label">Today's menu</span>
      <button class="s-sec-action" onclick="restoreDefaults()">Restore defaults</button>
    </div>
    <div class="t-list" id="t-list"></div>
    <div id="add-area" style="margin-top:4px"></div>
  </div>

  <div class="s-footer">
    <div class="count-line" id="count-line"></div>
    <button class="btn-go" onclick="goWho()">Hand to kids →</button>
    <button class="btn-outline" onclick="doReset()">Reset for tomorrow</button>
  </div>
</div>

<!-- ── WHO ────────────────────────────────────────────────────────────────── -->
<div id="v-who" class="hidden">
  <h1 class="w-h1">Good morning! ☀️</h1>
  <p class="w-sub" id="w-sub">Who's eating breakfast?</p>
  <div class="kid-cards" id="kid-cards"></div>
  <div class="all-done hidden" id="all-done"></div>
  <button class="gear-btn" onclick="goSetup()" aria-label="Setup">⚙️</button>
</div>

<!-- ── PICK ───────────────────────────────────────────────────────────────── -->
<div id="v-pick" class="hidden">
  <div class="pick-hd">
    <button class="back-btn" onclick="goWho()" aria-label="Back">←</button>
    <h1 class="pick-h1" id="pick-h1">Pick your breakfast!</h1>
    <p class="pick-sub">Tap everything you want this morning</p>
  </div>
  <div class="card-grid" id="card-grid"></div>
  <div class="pick-done-bar">
    <button class="pick-done-btn" id="pick-done-btn" onclick="donePicking()" disabled>Pick something first!</button>
  </div>
</div>

<!-- ── OVERLAY ────────────────────────────────────────────────────────────── -->
<div id="overlay">
  <div id="ov-bg"></div>
  <canvas id="ov-canvas"></canvas>
  <div id="ov-card">
    <span id="ov-emoji"></span>
    <div class="ov-kid" id="ov-kid"></div>
    <div class="ov-chose">chose…</div>
    <div id="ov-name"></div>
    <div id="ov-msg"></div>

// ── Storage ────────────────────────────────────────────────────────────────────
const SK = { items:'bf-items-v4', active:'bf-active-v4', choices:'bf-choices-v4', kids:'bf-kids-v4', history:'bf-history-v1' };
let items, active, choices, kids, history;
let serverAvailable = false;

function applyState(data) {
  if (data.items && Object.keys(data.items).length) {
    items = data.items;
  } else {
    try { items = JSON.parse(localStorage.getItem(SK.items)) || clone(DEFAULTS); } catch(e){ items = clone(DEFAULTS); }
  }
  if (data.active) {
    active = new Set(data.active);
  } else {
    try { const a = JSON.parse(localStorage.getItem(SK.active)); active = new Set(a || Object.keys(items)); } catch(e){ active = new Set(Object.keys(items)); }
  }
  choices = data.choices || (() => { try { return JSON.parse(localStorage.getItem(SK.choices)) || {}; } catch(e){ return {}; } })();
  kids    = data.kids    || (() => { try { return JSON.parse(localStorage.getItem(SK.kids))    || ['Jonah','Lily']; } catch(e){ return ['Jonah','Lily']; } })();
  history = data.history || (() => { try { return JSON.parse(localStorage.getItem(SK.history)) || []; } catch(e){ return []; } })();
  // Mirror to localStorage for offline fallback
  localStorage.setItem(SK.items,   JSON.stringify(items));
  localStorage.setItem(SK.active,  JSON.stringify([...active]));
  localStorage.setItem(SK.choices, JSON.stringify(choices));
  localStorage.setItem(SK.kids,    JSON.stringify(kids));
  localStorage.setItem(SK.history, JSON.stringify(history));
}

async function load() {
  try {
    const resp = await fetch('/api/breakfast', { signal: AbortSignal.timeout(3000) });
    if (resp.ok) {
      const data = await resp.json();
      serverAvailable = true;
      applyState(data);
      return;
    }
  } catch(e) { /* server not reachable — use localStorage */ }
  serverAvailable = false;
  applyState({});
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function pushToServer() {
  if (!serverAvailable) return;
  fetch('/api/breakfast', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ items, active: [...active], choices, kids, history }),
  }).catch(() => {});
}

const save = {
  items()  { localStorage.setItem(SK.items,   JSON.stringify(items));        pushToServer(); },
  active() { localStorage.setItem(SK.active,  JSON.stringify([...active]));  pushToServer(); },
  choices(){ localStorage.setItem(SK.choices, JSON.stringify(choices));       pushToServer(); },
  kids()   { localStorage.setItem(SK.kids,    JSON.stringify(kids));          pushToServer(); },
  history(){ localStorage.setItem(SK.history, JSON.stringify(history));       pushToServer(); },
};

// ── Helpers ────────────────────────────────────────────────────────────────────
function hash(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))&0xFFFF; return h; }
function gradOf(id){ return (items[id]?.g) || XGRADS[hash(id)%XGRADS.length]; }
function fxOf(id)  { return (items[id]?.fx)|| FXTYPES[hash(id)%FXTYPES.length]; }
function btnOf(g)  { const m=g.match(/#([0-9A-Fa-f]{6})\)$/); return m?'#'+m[1]:'#444'; }
function esc(s)    { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function show(id)  { ['v-setup','v-who','v-pick'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==id)); }

// ── Emoji picker state ─────────────────────────────────────────────────────────
let pickerEmoji = '🍽';
let editingId   = null;

function setPickerEmoji(e, gridId) {
  pickerEmoji = e;
  const sel = document.querySelector('.sel-emoji');
  if (sel) sel.textContent = e;
  document.querySelectorAll(`#${gridId} .eopt`).forEach(btn => {
    btn.classList.toggle('sel', btn.dataset.e === e);
  });
}

function buildEmojiGrid(gridId, initial) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = '';
  FOOD_EMOJIS.forEach(e => {
    const btn = document.createElement('button');
    btn.className = `eopt${e === initial ? ' sel' : ''}`;
    btn.textContent = e;
    btn.dataset.e = e;
    btn.addEventListener('click', () => setPickerEmoji(e, gridId));
    grid.appendChild(btn);
  });
}

function onNameInput(val, gridId) {
  const suggested = suggestEmoji(val);
  const hint = document.getElementById('emoji-hint');
  if (suggested) {
    setPickerEmoji(suggested, gridId);
    if (hint) { hint.innerHTML = `Suggested: <span>${suggested}</span>`; hint.style.display=''; }
  } else {
    if (hint) hint.style.display='none';
  }
}

// ── Views ──────────────────────────────────────────────────────────────────────
let currentKid = null;
let currentSelections = new Set();

function goSetup() {
  syncKidsFromDOM();
  renderSetup();
  show('v-setup');
}

function goWho() {
  syncKidsFromDOM();
  save.active(); save.kids();
  renderWho();
  show('v-who');

function goPick(kidName) {
  currentKid = kidName;
  // Pre-populate with any existing choices for today
  const existing = choices[kidName];
  if (existing?.itemIds) {
    currentSelections = new Set(existing.itemIds);
  } else if (existing?.itemId) {
    currentSelections = new Set([existing.itemId]);
  } else {
    currentSelections = new Set();
  }
  document.getElementById('pick-h1').textContent = `What do you want, ${kidName}?`;
  renderGrid();
  updateDoneBtn();
  show('v-pick');
}

function donePicking() {
  if (!currentSelections.size) return;
  const t = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  choices[currentKid] = { itemIds: [...currentSelections], time: t };
  save.choices();

  const selectedIds = [...currentSelections];
  const citems = selectedIds.map(id => items[id]).filter(Boolean);
  // Append to permanent history with a snapshot so deleted items still show
  history.push({
    kid: currentKid,
    itemIds: selectedIds,
    snapshot: Object.fromEntries(selectedIds.map(id => [id, { name: items[id]?.name, emoji: items[id]?.emoji }])),
    ts: Date.now(),
  });
  save.history();
  currentSelections = new Set();

  // Pick affirmation and build combined overlay
  const affirmation = AFFIRMATIONS[Math.floor(Math.random() * AFFIRMATIONS.length)];
  const emojis = citems.map(i => i.emoji).join(' ');
  const names  = citems.map(i => i.name).join(', ');

  const emojiEl = document.getElementById('ov-emoji');
  emojiEl.textContent = emojis;
  emojiEl.style.fontSize = citems.length >= 4 ? '3em' : citems.length >= 3 ? '3.5em' : citems.length >= 2 ? '4em' : '5.5em';

  document.getElementById('ov-name').textContent = names;
  document.getElementById('ov-msg').textContent  = affirmation;
  document.getElementById('ov-kid').textContent  = currentKid || '';

  // Gradient and FX from the first item (or random)
  const firstId = choices[currentKid]?.itemIds?.[0];
  const g = firstId ? gradOf(firstId) : 'linear-gradient(145deg,#FFCD7B,#D97B0A)';
  ovBg.style.background = g;
  document.getElementById('ov-btn').style.background = btnOf(g);

  overlay.classList.add('show');
  ['ov-card','ov-emoji'].forEach(eid => {
    const el = document.getElementById(eid);
    el.style.animation = 'none'; el.offsetHeight; el.style.animation = '';
  });
  resizeCv();
  // Mixed particle FX: use fruits for multi-item, else first item's fx
  launchFx(citems.length > 1 ? 'fruits' : (firstId ? fxOf(firstId) : 'stars'));
}

function updateDoneBtn() {
  const btn = document.getElementById('pick-done-btn');
  if (!btn) return;
  const n = currentSelections.size;
  btn.disabled = n === 0;
  btn.textContent = n === 0 ? 'Pick something first!'
                 : n === 1 ? 'All done! →'
                 :           `All done — ${n} items! →`;
}

function choiceItems(c) {
  if (!c) return [];
  if (c.itemIds) return c.itemIds.map(id => items[id]).filter(Boolean);
  if (c.itemId && items[c.itemId]) return [items[c.itemId]];
  return [];
}

// ── Setup ──────────────────────────────────────────────────────────────────────
function renderSetup() {
  renderKids();
  renderChoices();
  renderHistory();
  renderMenu();
  showAddBtn();
  updateCount();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!el) return;
  if (!history.length) {
    el.innerHTML = '<div class="no-choices">No history yet — choices will appear here.</div>';
    return;
  }
  // Group by calendar date, newest first
  const groups = new Map();
  [...history].reverse().forEach(entry => {
    const d = new Date(entry.ts);
    const key = d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric', year:'numeric' });
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(entry);
  });
  el.innerHTML = '';
  groups.forEach((entries, dateLabel) => {
    const grp = document.createElement('div');
    grp.className = 'h-group';
    const hdr = document.createElement('div');
    hdr.className = 'h-date';
    hdr.textContent = dateLabel;
    grp.appendChild(hdr);
    entries.forEach(entry => {
      const kidIdx = kids.indexOf(entry.kid);
      const color = KCOLS[Math.max(0, kidIdx) % KCOLS.length];
      const itemList = (entry.itemIds || []).map(id => {
        const live = items[id];
        const snap = entry.snapshot?.[id];
        return live || snap || null;
      }).filter(Boolean);
      const val = itemList.map(i => `${i.emoji} ${esc(i.name)}`).join(', ') || '—';
      const time = new Date(entry.ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      const row = document.createElement('div');
      row.className = 'h-row';
      row.innerHTML = `
        <div class="c-dot" style="background:${color};width:22px;height:22px;font-size:10px">${(entry.kid[0]||'?').toUpperCase()}</div>
        <span class="h-name">${esc(entry.kid)}</span>
        <span class="h-val">${val}</span>
        <span class="h-time">${time}</span>`;
      grp.appendChild(row);
    });
    el.appendChild(grp);
  });
}

function clearHistory() {
  if (!history.length) return;
  history = [];
  save.history();
  renderHistory();
  toast('History cleared');
}

function renderKids() {
  const el = document.getElementById('kids-list');
  el.innerHTML = '';
  kids.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'kid-row';
    row.innerHTML = `
      <div class="kid-dot" style="background:${KCOLS[i%KCOLS.length]}">${(name[0]||'?').toUpperCase()}</div>
      <input class="kid-input" data-i="${i}" value="${esc(name)}" placeholder="Kid's name" maxlength="20"
        oninput="kids[${i}]=this.value;this.previousElementSibling.textContent=(this.value[0]||'?').toUpperCase()">
      <button class="icon-btn" onclick="removeKid(${i})" aria-label="Remove">×</button>`;
    el.appendChild(row);
  });
  if (kids.length < 6) {
    const btn = document.createElement('button');
    btn.className = 'dashed-btn';
    btn.textContent = '+ Add kid';
    btn.onclick = addKid;
    el.appendChild(btn);
  }
}

function syncKidsFromDOM() {
  document.querySelectorAll('.kid-input').forEach((inp,i) => { kids[i] = inp.value.trim() || 'Kid'; });
  save.kids();
}

function addKid() {
  syncKidsFromDOM();
  kids.push('');
  save.kids();
  renderKids();
  document.querySelectorAll('.kid-input')[kids.length-1]?.focus();
}

function removeKid(i) {
  syncKidsFromDOM();
  kids.splice(i,1);
  save.kids();
  renderKids();
  renderChoices();
}

function renderChoices() {
  const el = document.getElementById('choices-display');
  const valid = kids.filter(k=>k.trim());
  if (!valid.length) { el.innerHTML = '<div class="no-choices">Add kids above to track choices.</div>'; return; }
  const list = document.createElement('div');
  list.className = 'choices-list';
  valid.forEach((name,i) => {
    const c = choices[name];
    const citems = choiceItems(c);
    const row = document.createElement('div');
    row.className = 'c-row';
    if (citems.length) {
      const val = citems.map(it=>`${it.emoji} ${esc(it.name)}`).join(', ');
      row.innerHTML = `
        <div class="c-dot" style="background:${KCOLS[i%KCOLS.length]}">${(name[0]||'?').toUpperCase()}</div>
        <span class="c-name">${esc(name)}</span>
        <span class="c-val">${val}</span>
        <span class="c-time">${c.time}</span>`;
    } else {
      row.innerHTML = `
        <div class="c-dot" style="background:${KCOLS[i%KCOLS.length]};opacity:.3">${(name[0]||'?').toUpperCase()}</div>
        <span class="c-name" style="color:var(--p-text3)">${esc(name)}</span>
        <span class="c-val" style="color:var(--p-text3)">—</span>`;
    }
    list.appendChild(row);
  });
  el.innerHTML = '';
  el.appendChild(list);
}

function renderMenu() {
  const el = document.getElementById('t-list');
  el.innerHTML = '';
  Object.keys(items).forEach(id => {
    const item = items[id];
    const on = active.has(id);
    const row = document.createElement('div');
    row.className = `t-row ${on?'on':'off'}`;
    row.id = `tr-${id}`;
    row.innerHTML = `
      <button class="t-action-btn del" onclick="delItem('${id}',event)" title="Remove">–</button>
      <button class="t-action-btn" onclick="showEditForm('${id}',event)" title="Edit">✏️</button>
      <span class="t-emoji">${item.emoji}</span>
      <span class="t-name">${esc(item.name)}</span>
      <div class="t-sw"></div>`;
    row.addEventListener('click', e => {
      if (!e.target.closest('.t-action-btn')) toggleItem(id);
    });
    el.appendChild(row);
  });
}

// ── Add item ───────────────────────────────────────────────────────────────────
function showAddBtn() {
  document.getElementById('add-area').innerHTML =
    `<button class="dashed-btn" style="width:100%;justify-content:center" onclick="showAddForm()">+ Add item</button>`;
}

function showAddForm() {
  pickerEmoji = '🍽';
  document.getElementById('add-area').innerHTML = `
    <div class="item-form">
      <div class="form-top-row">
        <div class="sel-emoji">${pickerEmoji}</div>
        <input class="form-name-inp" id="new-name" placeholder="e.g. Avocado Toast" maxlength="30"
          oninput="onNameInput(this.value,'add-emoji-grid')">
      </div>
      <div id="emoji-hint" class="emoji-hint" style="display:none"></div>
      <div class="emoji-grid" id="add-emoji-grid"></div>
      <div class="form-actions">
        <button class="btn-confirm" onclick="confirmAdd()">Add to menu</button>
        <button class="btn-cancel-sm" onclick="showAddBtn()">Cancel</button>
      </div>
    </div>`;
  buildEmojiGrid('add-emoji-grid', pickerEmoji);
  document.getElementById('new-name').focus();
  document.getElementById('new-name').onkeydown = e => { if(e.key==='Enter') confirmAdd(); };
}

function confirmAdd() {
  const name = document.getElementById('new-name')?.value.trim();
  if (!name) { toast('Enter a name for the item'); return; }
  const id = 'x-' + name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') + '-' + Date.now();
  items[id] = { name, emoji: pickerEmoji, custom: true, msg: 'Great choice! 🎉' };
  active.add(id);
  save.items(); save.active();
  renderMenu(); showAddBtn(); updateCount();
}

// ── Edit item ──────────────────────────────────────────────────────────────────
function showEditForm(id, e) {
  e.stopPropagation();
  const item = items[id];
  pickerEmoji = item.emoji;
  editingId = id;

  // Replace the row with an inline form
  const row = document.getElementById(`tr-${id}`);
  if (!row) return;

  const wrapper = document.createElement('div');
  wrapper.id = `ef-${id}`;
  wrapper.className = 'item-form inline';
  wrapper.innerHTML = `
    <div class="form-top-row">
      <div class="sel-emoji">${item.emoji}</div>
      <input class="form-name-inp" id="en-${id}" value="${esc(item.name)}" placeholder="Item name" maxlength="30"
        oninput="onNameInput(this.value,'eg-${id}')">
    </div>
    <div class="emoji-grid" id="eg-${id}"></div>
    <div class="form-actions" style="margin-top:2px">
      <button class="btn-confirm" onclick="confirmEdit('${id}')">Save</button>
      <button class="btn-cancel-sm" onclick="renderMenu();showAddBtn()">Cancel</button>
    </div>`;

  row.replaceWith(wrapper);
  buildEmojiGrid(`eg-${id}`, item.emoji);
  document.getElementById(`en-${id}`)?.focus();
}

function confirmEdit(id) {
  const nameEl = document.getElementById(`en-${id}`);
  if (!nameEl) return;
  const name = nameEl.value.trim();
  if (!name) { toast('Enter a name'); return; }
  items[id] = { ...items[id], name, emoji: pickerEmoji };
  save.items();
  editingId = null;
  renderMenu(); showAddBtn(); updateCount();
}

// ── Menu helpers ───────────────────────────────────────────────────────────────
function toggleItem(id) {
  if (active.has(id)) active.delete(id); else active.add(id);
  const row = document.getElementById(`tr-${id}`);
  if (row) { row.classList.toggle('on',active.has(id)); row.classList.toggle('off',!active.has(id)); }
  updateCount();
}

function delItem(id, e) {
  e.stopPropagation();
  delete items[id]; active.delete(id);
  save.items(); save.active();
  renderMenu(); showAddBtn(); updateCount();
}

function restoreDefaults() {
  Object.assign(items, clone(DEFAULTS));
  Object.keys(DEFAULTS).forEach(id => active.add(id));
  save.items(); save.active();
  renderMenu(); showAddBtn(); updateCount();
  toast('Default items restored');
}

function updateCount() {
  const n = [...active].filter(id=>items[id]).length;
  document.getElementById('count-line').innerHTML =
    n ? `<strong>${n}</strong> item${n!==1?'s':''} on today's menu` : `No items on today's menu`;
}

function doReset() {
  choices = {}; save.choices();
  renderChoices(); renderWho();
  toast('Choices cleared for tomorrow');
}

// ── Who ────────────────────────────────────────────────────────────────────────
function renderWho() {
  const grid = document.getElementById('kid-cards');
  const doneEl = document.getElementById('all-done');
  grid.innerHTML = '';
  const valid = kids.filter(k=>k.trim());
  const allDone = valid.length > 0 && valid.every(k => choiceItems(choices[k]).length > 0);

  valid.forEach((name, i) => {
    const c = choices[name];
    const citems = choiceItems(c);
    const card = document.createElement('div');
    card.className = `kcard${citems.length?' done':''}`;
    card.style.background = KPASTEL[i%KPASTEL.length];
    if (citems.length) {
      const emojis = citems.map(it=>it.emoji).join(' ');
      const names  = citems.map(it=>esc(it.name)).join(', ');
      card.innerHTML = `
        <div class="k-initial">${(name[0]||'?').toUpperCase()}</div>
        <div class="k-kname">${esc(name)}</div>
        <div class="k-choice"><div class="k-choice-emoji">${emojis}</div><div>${names}</div></div>`;
    } else {
      card.innerHTML = `
        <div class="k-initial">${(name[0]||'?').toUpperCase()}</div>
        <div class="k-kname">${esc(name)}</div>`;
      card.addEventListener('click', () => goPick(name));
    }
    grid.appendChild(card);
  });

  if (allDone && valid.length) {
    doneEl.classList.remove('hidden');
    doneEl.innerHTML = `All done this morning! 🌟<br><small style="opacity:.7">Tap ⚙️ to see the full log.</small>`;
  } else {
    doneEl.classList.add('hidden');
  }

  const remaining = valid.filter(k=>!choiceItems(choices[k]).length);
  document.getElementById('w-sub').textContent =
    (remaining.length && remaining.length < valid.length)
      ? `${remaining.map(k=>k.split(' ')[0]).join(' & ')} — your turn!`
      : "Who's eating breakfast?";
}

// ── Grid ───────────────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  const ids = Object.keys(items).filter(id=>active.has(id));
  if (!ids.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">☕</div><p>Nothing on the menu.<br>Ask a grown-up to tap ⚙️!</p></div>`;
    return;
  }
  ids.forEach(id => {
    const item = items[id];
    const card = document.createElement('div');
    card.className = `bcard${currentSelections.has(id)?' sel':''}`;
    card.id = `bc-${id}`;
    card.style.background = gradOf(id);
    card.innerHTML = `<span class="bcard-emoji">${item.emoji}</span><span class="bcard-name">${esc(item.name)}</span>`;
    card.addEventListener('click', () => pickItem(id));
    grid.appendChild(card);
  });
}

// ── Overlay ────────────────────────────────────────────────────────────────────
const overlay = document.getElementById('overlay');
const ovBg    = document.getElementById('ov-bg');
const canvas  = document.getElementById('ov-canvas');
const ctx     = canvas.getContext('2d');
let raf=null, pts=[];

function pickItem(id) {
  if (currentSelections.has(id)) {
    currentSelections.delete(id);
    const card = document.getElementById(`bc-${id}`);
    if (card) card.classList.remove('sel');
  } else {
    currentSelections.add(id);
    const card = document.getElementById(`bc-${id}`);
    if (card) card.classList.add('sel');
  }
  updateDoneBtn();
}

function dismissOverlay() {
  overlay.classList.remove('show');
  if(raf){cancelAnimationFrame(raf);raf=null;}
  pts=[];ctx.clearRect(0,0,canvas.width,canvas.height);
  goWho();
}

function resizeCv(){ canvas.width=innerWidth; canvas.height=innerHeight; }
function loopFx(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.update();p.draw(ctx);if(p.dead)pts.splice(i,1);}
  raf=requestAnimationFrame(loopFx);
}
function launchFx(type){ if(raf)cancelAnimationFrame(raf); pts=[]; FX[type](); loopFx(); }

// ── Particles ──────────────────────────────────────────────────────────────────
const TAU=Math.PI*2,CC=Math.cos,SS=Math.sin;
const rv=(a,b)=>a+Math.random()*(b-a);
const p1=a=>a[0|Math.random()*a.length];
const later=(ms,fn)=>setTimeout(fn,ms);
const sp=p=>{p.dead=false;pts.push(p);};

const FX={
  syrup(){const cs=['#7A3A10','#C07030','#C06028','#906020','#C8A030'];for(let i=0;i<70;i++)later(i*55,()=>sp({x:rv(0,canvas.width),y:rv(-80,-10),w:rv(4,12),h:rv(18,36),vx:rv(-1,1),vy:rv(3,7),color:p1(cs),alpha:rv(.7,1),update(){this.x+=this.vx;this.y+=this.vy;if(this.y>canvas.height+60)this.dead=true;},draw(c){c.globalAlpha=this.alpha;c.fillStyle=this.color;c.beginPath();c.ellipse(this.x,this.y,this.w/2,this.h/2,.2,0,TAU);c.fill();c.globalAlpha=1;}}));},
  stars(){const cs=['#FFD700','#FFA500','#FFEE44','#FFE066'];const cx=canvas.width/2,cy=canvas.height/2;for(let i=0;i<55;i++){const a=rv(0,TAU),spd=rv(3,10);sp({x:cx,y:cy,vx:CC(a)*spd,vy:SS(a)*spd,size:rv(10,22),color:p1(cs),rot:rv(0,TAU),rotV:rv(-.3,.3),alpha:1,gv:.18,update(){this.vy+=this.gv;this.x+=this.vx;this.y+=this.vy;this.rot+=this.rotV;this.alpha-=.013;if(this.alpha<=0)this.dead=true;},draw(c){c.save();c.globalAlpha=this.alpha;c.translate(this.x,this.y);c.rotate(this.rot);c.fillStyle=this.color;star5(c,0,0,this.size,this.size*.45);c.fill();c.restore();}});}},
  circles(){const cs=['#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#FFD93D','#A29BFE','#FF9FF3'];for(let i=0;i<90;i++)later(i*35,()=>sp({x:rv(0,canvas.width),y:rv(-100,-8),vx:rv(-2.5,2.5),vy:rv(2,5),rad:rv(7,16),color:p1(cs),lw:rv(3,5),rot:rv(0,TAU),rotV:rv(-.12,.12),update(){this.x+=this.vx;this.y+=this.vy;this.rot+=this.rotV;if(this.y>canvas.height+30)this.dead=true;},draw(c){c.save();c.translate(this.x,this.y);c.rotate(this.rot);c.strokeStyle=this.color;c.lineWidth=this.lw;c.beginPath();c.arc(0,0,this.rad,0,TAU);c.stroke();c.restore();}}));},
  crumbs(){const cs=['#D2691E','#8B4513','#A0522D','#CD853F','#DEB887'];const cx=canvas.width/2,cy=canvas.height*.42;for(let w=0;w<5;w++)later(w*260,()=>{for(let i=0;i<18;i++){const a=rv(0,TAU),spd=rv(4,13);sp({x:cx+rv(-30,30),y:cy+rv(-30,30),vx:CC(a)*spd,vy:SS(a)*spd-4,size:rv(3,9),color:p1(cs),gv:.45,rot:rv(0,TAU),rotV:rv(-.4,.4),alpha:1,update(){this.vy+=this.gv;this.x+=this.vx;this.y+=this.vy;this.vx*=.98;this.rot+=this.rotV;if(this.y>canvas.height+20)this.dead=true;},draw(c){c.save();c.globalAlpha=this.alpha;c.fillStyle=this.color;c.translate(this.x,this.y);c.rotate(this.rot);c.fillRect(-this.size/2,-this.size/2,this.size,this.size);c.restore();}});}});},
  sparkles(){const cs=['#FFD700','#FF69B4','#FF1493','#FFB6C1','#FFFACD'];let n=0;(function add(){if(!overlay.classList.contains('show')||n>=150)return;n++;sp({x:rv(0,canvas.width),y:rv(0,canvas.height),size:rv(6,24),color:p1(cs),rot:rv(0,TAU),alpha:0,phase:'in',spd:rv(.035,.07),update(){if(this.phase==='in'){this.alpha+=this.spd;if(this.alpha>=1){this.alpha=1;this.phase='out';}}else{this.alpha-=this.spd*.65;if(this.alpha<=0)this.dead=true;}},draw(c){const s=this.size;c.save();c.globalAlpha=this.alpha;c.fillStyle=this.color;c.translate(this.x,this.y);c.rotate(this.rot);c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(s*.18,-s*.18,s,0);c.quadraticCurveTo(s*.18,s*.18,0,s);c.quadraticCurveTo(-s*.18,s*.18,-s,0);c.quadraticCurveTo(-s*.18,-s*.18,0,-s);c.fill();c.restore();}});setTimeout(add,rv(80,180));})();},
  bubbles(){const cs=['#55EFC4','#00CEC9','#FDCB6E','#A29BFE','#FD79A8','#74B9FF'];for(let i=0;i<90;i++)later(i*70+rv(0,50),()=>{const rad=rv(9,32);sp({x:rv(0,canvas.width),y:canvas.height+rad,rad,color:p1(cs),alpha:rv(.35,.72),vy:-rv(1.5,3.5),vx:rv(-.5,.5),wob:rv(0,TAU),wobV:rv(.04,.09),update(){this.wob+=this.wobV;this.x+=SS(this.wob)*1.8+this.vx;this.y+=this.vy;if(this.y<-this.rad*2)this.dead=true;},draw(c){c.globalAlpha=this.alpha;c.fillStyle=this.color;c.beginPath();c.arc(this.x,this.y,this.rad,0,TAU);c.fill();c.globalAlpha=this.alpha*.55;c.fillStyle='#fff';c.beginPath();c.arc(this.x-this.rad*.28,this.y-this.rad*.28,this.rad*.24,0,TAU);c.fill();c.globalAlpha=1;}});});},
  sizzle(){const cs=['#FF4500','#FF6348','#FF7F50','#FFA502','#FF6B6B'];for(let i=0;i<120;i++)later(i*40,()=>sp({x:rv(0,canvas.width),y:canvas.height*.55+rv(0,canvas.height*.45),vx:rv(-1.2,1.2),vy:-rv(1.2,4),size:rv(3,9),color:p1(cs),alpha:.85,wob:rv(0,TAU),wobV:rv(.1,.2),update(){this.wob+=this.wobV;this.x+=SS(this.wob)*2.5+this.vx;this.y+=this.vy;this.alpha-=.012;this.size*=1.01;if(this.alpha<=0)this.dead=true;},draw(c){c.globalAlpha=this.alpha;c.fillStyle=this.color;c.beginPath();c.arc(this.x,this.y,this.size,0,TAU);c.fill();c.globalAlpha=1;}}));},
  fruits(){const ls=['🍓','🍊','🍋','🍇','🍍','🥝','🍒','🍑','🍎','🫐','🍌','🍉'];const cx=canvas.width/2,cy=canvas.height*.45;for(let i=0;i<36;i++)later(i*80+rv(0,60),()=>{const a=rv(0,TAU),spd=rv(5,14);sp({x:cx,y:cy,vx:CC(a)*spd,vy:SS(a)*spd-5,emoji:p1(ls),size:rv(22,38),gv:.32,rot:rv(-.4,.4),rotV:rv(-.08,.08),alpha:1,update(){this.vy+=this.gv;this.x+=this.vx;this.y+=this.vy;this.vx*=.99;this.rot+=this.rotV;if(this.y>canvas.height+60)this.dead=true;},draw(c){c.save();c.globalAlpha=this.alpha;c.translate(this.x,this.y);c.rotate(this.rot);c.font=`${this.size}px serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(this.emoji,0,0);c.restore();}});});},
};

function star5(c,cx,cy,r,ir){let rot=-Math.PI/2;const s=Math.PI/5;c.beginPath();c.moveTo(cx+CC(rot)*r,cy+SS(rot)*r);for(let i=0;i<5;i++){rot+=s;c.lineTo(cx+CC(rot)*ir,cy+SS(rot)*ir);rot+=s;c.lineTo(cx+CC(rot)*r,cy+SS(rot)*r);}c.closePath();}

window.addEventListener('resize',()=>{if(overlay.classList.contains('show'))resizeCv();});
overlay.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400);
}

// ── Init ───────────────────────────────────────────────────────────────────────
(async () => {
  await load();
  const firstTime = !serverAvailable && !localStorage.getItem(SK.kids) && !localStorage.getItem(SK.items);
  if (firstTime) { renderSetup(); show('v-setup'); }
  else           { renderWho();   show('v-who');   }
})();

// Re-sync when the app is brought back into focus on any device
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) return;
  const before = JSON.stringify({ items, active: [...active], choices, kids });
  await load();
  const after = JSON.stringify({ items, active: [...active], choices, kids });
  if (before === after) return;
  // State changed — re-render current view
  const cur = ['v-setup','v-who','v-pick'].find(v => !document.getElementById(v).classList.contains('hidden'));
  if (cur === 'v-setup') renderSetup();
  else if (cur === 'v-who') renderWho();
});
</script>
